<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="icon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Centre | Smartech Typing Tutor</title>
<script src="themes.js"></script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="sidebar.css">
<style>
html, body { height: 100%; margin: 0; }
body { font-family: var(--font-body); background: var(--bg); display: flex; flex-direction: column; min-height: 100vh; }

.tc-wrap { width: 92%; max-width: 1100px; margin: 24px auto 40px; }
.tc-lead {
  margin: 0 0 22px; padding: 14px 18px; border: 1px solid var(--border); border-left: 4px solid var(--gold);
  border-radius: 12px; background: var(--card); color: var(--muted); font-size: 14.5px; line-height: 1.6;
}
.tc-lead strong { color: var(--ink); }

.tc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; align-items: start; }
.tc-card {
  background: var(--card); border: 1px solid var(--border); border-top: 3px solid var(--gold);
  border-radius: 16px; box-shadow: var(--shadow-md); padding: 20px 20px 18px;
}
.tc-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.tc-card h2 { margin: 0; border: none; padding: 0; color: var(--ink); font-size: 1.15rem; flex: 1; min-width: 0; }
.tc-pill {
  font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 999px; background: var(--ink); color: #fff; white-space: nowrap;
}
.tc-pill.free { background: #2e7d32; }
.tc-pill.open { background: #2e7d32; }
.tc-pill.lock { background: #b26a00; }
.tc-desc { margin: 4px 0 10px; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
.tc-rule { margin: 0 0 14px; font-size: 13px; font-weight: 700; color: var(--ink); }
.tc-meta { margin: 0 0 12px; font-size: 12px; color: var(--muted); }

.tc-codebox { display: flex; gap: 8px; flex-wrap: wrap; }
.tc-codebox input {
  flex: 1; min-width: 150px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
  font-size: 14px; letter-spacing: .04em; text-transform: uppercase; background: var(--card); color: var(--ink);
}
.tc-btn {
  background: var(--ink); color: #fff; border: none; border-radius: 10px; padding: 10px 18px;
  font-weight: 700; font-size: .9rem; cursor: pointer;
}
.tc-btn:disabled { opacity: .6; cursor: wait; }
.tc-btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: 600; padding: 6px 12px; font-size: .8rem; }

.tc-ex { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.tc-ex .exercise-btn {
  background: var(--ink); color: #fff; border: none; border-radius: 10px; padding: 10px 16px;
  font-weight: 700; font-size: .9rem; cursor: pointer; transition: transform .12s ease;
}
.tc-ex .exercise-btn:hover { transform: translateY(-2px); }
.tc-empty { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; }
.tc-foot { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.tc-foot small { color: var(--muted); font-size: 12px; }
</style>

<script>
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if (e.key === 'F12') e.preventDefault();
    if (e.ctrlKey && e.shiftKey && e.key === 'I') e.preventDefault();
    if (e.ctrlKey && e.key === 'u') e.preventDefault();
    if (e.ctrlKey && e.key === 's') e.preventDefault();
});
</script>

<script src="profile.js"></script>
<script src="sidebar.js"></script>
<script src="activation.js"></script>
</head>
<body>
<div class="main">

<button id="menuToggle">&#9776;</button>

<div class="tc-wrap">

  <p class="tc-lead">
    <strong>How it works:</strong> each test below has its own <strong>time</strong>, <strong>pass rule</strong>
    and, where shown, its own <strong>access code</strong> from your institute. Enter the code once on this
    computer, then pick an exercise. Your result follows that test's pass rule.
  </p>

  <div class="tc-grid" id="tcGrid"><p class="tc-empty">Loading tests&hellip;</p></div>

</div>

<script src="exercises.js"></script>
<script src="tests.js"></script>
<script>
(function () {
  var grid = document.getElementById("tcGrid");
  var T = window.SmartechTests, E = window.SmartechExercises;
  var esc = T.esc;
  var loading = true;

  function statusOf(t) {
    if (!T.needsCode(t)) return { cls: "free", label: "Free", unlocked: true };
    var info = getActivationInfo(t.code);
    if (T.isUnlocked(t)) {
      var d = info.daysLeft;
      return { cls: "open", label: d === null ? "Unlocked" : (d + (d === 1 ? " day left" : " days left")), unlocked: true, info: info };
    }
    return { cls: "lock", label: info.expired ? "Expired" : "Code needed", unlocked: false, info: info };
  }

  function render() {
    var tests = E.tests();
    if (!tests.length) {
      grid.innerHTML = '<p class="tc-empty">' + (loading
        ? "Loading tests\u2026"
        : (navigator.onLine === false
            ? "You are offline. Connect to the internet once so the tests can download."
            : "No tests are available yet. Ask your institute to add them.")) + "</p>";
      return;
    }
    grid.innerHTML = "";
    tests.forEach(function (t) { grid.appendChild(card(t)); });
  }

  function card(t) {
    var st = statusOf(t);
    var el = document.createElement("section");
    el.className = "tc-card";
    var lang = t.lang ? '<span class="tc-pill">' + esc(t.lang) + "</span>" : "";
    el.innerHTML =
      '<div class="tc-top"><h2>' + esc(t.name) + "</h2>" + lang +
      '<span class="tc-pill ' + st.cls + '">' + esc(st.label) + "</span></div>" +
      (t.desc ? '<p class="tc-desc">' + esc(t.desc) + "</p>" : "") +
      '<p class="tc-rule">' + esc(T.summary(t)) + "</p>" +
      '<p class="tc-meta">' + (t.mode === "chunk" ? "Chunk typing" : "Long paragraph") + " test</p>" +
      '<div class="tc-body"></div>';
    var body = el.querySelector(".tc-body");

    if (!st.unlocked) {
      body.innerHTML =
        '<div class="tc-codebox"><input type="text" maxlength="40" placeholder="Enter activation code" autocomplete="off" spellcheck="false">' +
        '<button type="button" class="tc-btn">Activate</button></div>';
      var input = body.querySelector("input"), btn = body.querySelector("button");
      function go() {
        if (btn.disabled) return;
        btn.disabled = true; btn.textContent = "Checking\u2026";
        T.unlock(t, input.value).then(function (r) {
          if (r.reason === "EMPTY") { alert("Please type your activation code."); }
          if (r.ok) { render(); return; }
          btn.disabled = false; btn.textContent = "Activate";
        });
      }
      btn.addEventListener("click", go);
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
      return el;
    }

    var exs = E.testExercises(t.id);
    if (!exs.length) {
      body.innerHTML = '<p class="tc-empty">' + (loading ? "Loading exercises\u2026" : "No exercises have been added to this test yet.") + "</p>";
    } else {
      var list = document.createElement("div");
      list.className = "tc-ex";
      exs.forEach(function (ex, i) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "exercise-btn";
        b.textContent = (i + 1) + ". " + ex.title;
        b.addEventListener("click", function () { T.start(t, ex, i); });
        list.appendChild(b);
      });
      body.appendChild(list);
    }

    if (T.needsCode(t) && st.info && st.info.code) {
      var foot = document.createElement("div");
      foot.className = "tc-foot";
      foot.innerHTML = "<small>Access until " + esc(formatActivationDate(st.info.expiresAt)) + "</small>";
      el.appendChild(foot);
    }
    return el;
  }

  render();                                   // cached list first (works offline)
  E.refresh().then(function () {
    loading = false;
    render();
    // Quietly re-check unlocked codes with the sheet (blocked / expired codes lock again)
    return Promise.all(E.tests().map(function (t) { return T.revalidate(t); }));
  }).then(function (changed) {
    if (changed && changed.indexOf(true) !== -1) render();
  });
})();
</script>

</div>
</body>
</html>
